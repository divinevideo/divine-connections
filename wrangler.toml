# Deployed onto the existing worker named divine-crossposter, rather than a
# new one. Cloudflare secrets are attached to a worker name and cannot be read
# back. TOKEN_ENCRYPTION_KEY is not derivable, and it decrypts every stored
# OAuth token in D1. Deploying this code onto this worker keeps that key, along
# with the Twitter and Instagram credentials, instead of needing every value
# installed again on a new worker.
#
# The worker keeps that name; it now serves crossposting only.
name = "divine-crossposter"
main = "src/index.ts"
compatibility_date = "2025-09-06"

routes = [
  { pattern = "crossposter.divine.video", custom_domain = true }
]

[vars]
KEYCAST_URL = "https://login.divine.video"
FUNNELCAKE_URL = "https://api.divine.video"
OAUTH_REDIRECT_BASE = "https://crossposter.divine.video"
ENABLE_INSTAGRAM = "true"
# Instagram App ID from the Instagram business login product ("divine-IG"),
# not the Facebook App ID — see docs/instagram-setup.md.
INSTAGRAM_CLIENT_ID = "1495112838545237"
ENABLE_TIKTOK = "false"
ENABLE_X = "true"
ENABLE_YOUTUBE = "false"

# Binding to the existing crossposter database: live connections carry over,
# no data migration. Migrations in this repo apply to this database.
[[d1_databases]]
binding = "DB"
database_name = "divine-crossposter"
database_id = "8e84ca74-0dab-40cc-a8d7-b5cf03f32287"
migrations_dir = "migrations"

[[queues.producers]]
binding = "CROSSPOST_QUEUE"
queue = "divine-crossposter-jobs"

[[queues.producers]]
binding = "CROSSPOST_DLQ"
queue = "divine-crossposter-jobs-dlq"

# A queue allows exactly one consumer. This worker is that consumer now,
# because it *is* the worker that used to be divine-crossposter.
[[queues.consumers]]
queue = "divine-crossposter-jobs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "divine-crossposter-jobs-dlq"

# The reconciler. Only one worker runs it, so the double-fired ops alerts the
# split deployment risked cannot happen.
[triggers]
crons = ["* * * * *"]

# Retain sanitized console diagnostics; OAuth callback query strings must not
# be captured by automatic invocation logs.
[observability]
enabled = true
[observability.logs]
invocation_logs = false

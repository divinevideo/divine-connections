# Deployed onto the worker previously called divine-crossposter, rather than a
# new one. Cloudflare secrets are attached to a worker name and cannot be read
# back, and TOKEN_ENCRYPTION_KEY exists only here — it is not derivable, and it
# decrypts every stored OAuth token in the shared D1. Deploying the merged code
# onto this worker inherits that key, along with the Twitter and Instagram
# credentials, instead of stranding them on a service we are retiring.
#
# The name is therefore historical. This worker serves the whole merged
# product: verification, badge reads, connections, and crossposting.
name = "divine-crossposter"
main = "src/index.ts"
compatibility_date = "2025-09-06"

# Both public hostnames. verify.divine.video is one of the two redirect URIs
# keycast has registered for this client — it matches them as whole strings —
# so sign-in only works from a host in this set.
#
# TODO(#2): verifier.divine.video still points at the legacy verifier worker.
# It cannot move until DISCORD_BOT_TOKEN is installed here, or Discord
# verification regresses for anyone using that hostname.
routes = [
  { pattern = "crossposter.divine.video", custom_domain = true },
  { pattern = "verify.divine.video", custom_domain = true }
]

[vars]
KEYCAST_URL = "https://login.divine.video"
FUNNELCAKE_URL = "https://api.divine.video"
OAUTH_REDIRECT_BASE = "https://crossposter.divine.video"
ENABLE_INSTAGRAM = "true"
# Instagram App ID from the Instagram business login product ("divine-IG"),
# not the Facebook App ID — see docs/instagram-setup.md.
INSTAGRAM_CLIENT_ID = "1495112838545237"
ENABLE_TIKTOK = "false"
ENABLE_X = "true"
ENABLE_YOUTUBE = "false"
# Discord channel whose messages count as verification proof posts.
DISCORD_VERIFY_CHANNEL_ID = "1484771306179133582"

# Multi-worker binding on the existing crossposter database: live connections
# carry over, no data migration. Migrations (incl. the verifications table)
# land on this shared database.
[[d1_databases]]
binding = "DB"
database_name = "divine-crossposter"
database_id = "8e84ca74-0dab-40cc-a8d7-b5cf03f32287"
migrations_dir = "migrations"

# One KV namespace shared by negative verify results, NIP-05 results, and
# rate-limit windows. D1 owns success state; KV never holds successes.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "df90f1ec70df4d16bfa39e26d60a9f1c"

[[queues.producers]]
binding = "CROSSPOST_QUEUE"
queue = "divine-crossposter-jobs"

[[queues.producers]]
binding = "CROSSPOST_DLQ"
queue = "divine-crossposter-jobs-dlq"

# A queue allows exactly one consumer. This worker is that consumer now,
# because it *is* the worker that used to be divine-crossposter.
[[queues.consumers]]
queue = "divine-crossposter-jobs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "divine-crossposter-jobs-dlq"

# The reconciler. Only one worker runs it, so the double-fired ops alerts the
# split deployment risked cannot happen.
[triggers]
crons = ["* * * * *"]
